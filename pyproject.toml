[project]
name = "mikrotik-audit"
version = "1.1.1"
description = "Read-only MikroTik RouterOS assessment with a local CVE catalog"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
